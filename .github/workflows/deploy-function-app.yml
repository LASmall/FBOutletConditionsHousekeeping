name: Deploy Function App

# Builds, tests, and deploys the FBOutletConditionsHousekeeping Azure Function.
# Deployment only runs after build-and-test succeeds, so a failing test
# blocks a bad deployment rather than merely reporting it after the fact.
#
# Required one-time setup (see docs/SETUP-GUIDE.md Section 16.2):
#   - An Azure AD App Registration with a federated credential trusting this
#     repository/branch (OIDC) and "Contributor" (or more narrowly scoped)
#     access to the Function App's resource group — no client secret is
#     stored in GitHub.
#   - Repository secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
#   - Repository variable: AZURE_FUNCTIONAPP_NAME (the target Function App's name).

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "FBOutletConditionsHousekeeping.slnx"
      - ".github/workflows/deploy-function-app.yml"
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  FUNCTIONAPP_PROJECT_PATH: src/FBOutletConditionsHousekeeping.Functions
  PUBLISH_OUTPUT_PATH: ${{ github.workspace }}/publish

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore FBOutletConditionsHousekeeping.slnx

      - name: Build (Release)
        run: dotnet build FBOutletConditionsHousekeeping.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test FBOutletConditionsHousekeeping.slnx --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Publish Functions project
        run: >
          dotnet publish ${{ env.FUNCTIONAPP_PROJECT_PATH }}
          --configuration Release
          --output ${{ env.PUBLISH_OUTPUT_PATH }}

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: function-app-package
          path: ${{ env.PUBLISH_OUTPUT_PATH }}
          retention-days: 7
          # actions/upload-artifact excludes dotfiles/dot-directories by
          # default, which would silently drop the required .azurefunctions
          # directory (needed by Flex Consumption plan deployment) from the
          # artifact — see docs/SETUP-GUIDE.md Section 16.3 troubleshooting.
          include-hidden-files: true

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      id-token: write # required for Azure OIDC federated login
      contents: read
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: function-app-package
          path: ${{ env.PUBLISH_OUTPUT_PATH }}

      - name: Azure login (OIDC — no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.PUBLISH_OUTPUT_PATH }}

      - name: Azure logout
        if: always()
        run: az logout
